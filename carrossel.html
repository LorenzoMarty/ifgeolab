<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Orbiting Models</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #3a5a40;
        }

        model-viewer {
            position: absolute;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            pointer-events: auto;
        }
    </style>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.min.js"></script>
    <script>
        // Tamanho e espaçamento das linhas
        const gridSize = 50; // Tamanho total da grade (em unidades)
        const gridSpacing = 0.5; // Espaçamento entre as linhas

        // Material para as linhas
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x000000, opacity: 0.5, transparent: true });

        // Função para gerar a grade
        function createGrid() {
            const lines = new THREE.Group(); // Agrupando as linhas

            // Gerar linhas paralelas ao eixo X
            for (let i = -gridSize / 2; i <= gridSize / 2; i += gridSpacing) {
                const geometry = new THREE.BufferGeometry();
                const vertices = new Float32Array([
                    -gridSize / 2, 0, i, // Ponto inicial
                    gridSize / 2, 0, i // Ponto final
                ]);
                geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
                const line = new THREE.Line(geometry, lineMaterial);
                lines.add(line);
            }

            // Gerar linhas paralelas ao eixo Z
            for (let i = -gridSize / 2; i <= gridSize / 2; i += gridSpacing) {
                const geometry = new THREE.BufferGeometry();
                const vertices = new Float32Array([
                    i, 0, -gridSize / 2, // Ponto inicial
                    i, 0, gridSize / 2 // Ponto final
                ]);
                geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
                const line = new THREE.Line(geometry, lineMaterial);
                lines.add(line);
            }

            return lines;
        }

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x3a5a40, 1);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xffffff, 1);
        pointLight.position.set(10, 10, 10);
        scene.add(pointLight);

        const grid = createGrid();
        scene.add(grid);

        const orbitingObjects = [];
        const orbitRadius = 30;
        const numObjects = 5;

        for (let i = 0; i < numObjects; i++) {
            const angle = (i / numObjects) * Math.PI * 2;

            const modelViewer = document.createElement("model-viewer");
            modelViewer.src = "obj/gold.glb"; // Substitua pelo caminho correto do modelo 3D
            modelViewer.alt = `Modelo ${i + 1}`;
            modelViewer.autoRotate = true;
            modelViewer.cameraControls = true;

            document.body.appendChild(modelViewer);

            orbitingObjects.push({
                element: modelViewer,
                position: new THREE.Vector3(
                    orbitRadius * Math.cos(angle),
                    0,
                    orbitRadius * Math.sin(angle)
                ),
                angle,
                targetAngle: angle
            });
        }
        camera.position.set(0, 10, 50); // Afastando a câmera para visão mais ampla
        camera.lookAt(new THREE.Vector3(0, 0, 0)); // Mantém o foco no centro


        const targetAngle = Math.PI / 2;
        let isRotating = false;
        const rotationSpeed = 0.02;

        window.addEventListener('click', (event) => {
            const clickedElement = document.elementFromPoint(event.clientX, event.clientY);

            const clickedObject = orbitingObjects.find(obj => obj.element === clickedElement);
            if (clickedObject) {
                const clickedAngle = clickedObject.angle;
                const rotationNeeded = (targetAngle - clickedAngle + Math.PI * 2) % (Math.PI * 2);
                orbitingObjects.forEach(obj => {
                    obj.targetAngle = (obj.angle + rotationNeeded) % (2 * Math.PI);
                });
                isRotating = true;
            }
        });

        const animate = function () {
            requestAnimationFrame(animate);

            if (isRotating) {
                let allAligned = true;
                orbitingObjects.forEach(obj => {
                    const angleDifference = (obj.targetAngle - obj.angle + Math.PI * 2) % (Math.PI * 2);
                    if (angleDifference > rotationSpeed) {
                        obj.angle += rotationSpeed;
                        obj.angle %= Math.PI * 2;
                        obj.position.x = orbitRadius * Math.cos(obj.angle);
                        obj.position.z = orbitRadius * Math.sin(obj.angle);
                        allAligned = false;
                    } else {
                        obj.angle = obj.targetAngle;
                        obj.position.x = orbitRadius * Math.cos(obj.targetAngle);
                        obj.position.z = orbitRadius * Math.sin(obj.targetAngle);
                    }
                });

                if (allAligned) {
                    isRotating = false;
                }
            }

            orbitingObjects.forEach(obj => {
                const screenPosition = obj.position.clone().project(camera);
                const x = (screenPosition.x * 0.5 + 0.5) * window.innerWidth;
                const y = -(screenPosition.y * 0.5 - 0.5) * window.innerHeight;

                obj.element.style.left = `${x}px`;
                obj.element.style.top = `${y}px`;
            });

            renderer.render(scene, camera);
        };

        animate();
    </script>
</body>

</html>
